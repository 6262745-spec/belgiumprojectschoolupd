<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belgium Project Site</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="presentation-container">
    <div class="slide active">
      <h1>Slide 1</h1>
      <p>
        <span class="hint-desktop">Use the right arrow to move</span>
        <span class="hint-touch">Swipe to move</span>
      </p>
    </div>

    <div class="slide">
      <h1>Slide 2</h1>
      <p>This is the second slide.</p>
    </div>

    <div class="slide">
      <h1>Slide 3</h1>
      <p>Slide 3</p>
    </div>

    <div class="slide">
      <canvas id="game" height="400"></canvas>

      <div id="touch-dive"></div>
      <div id="touch-jump"></div>

      <div id="quiz" class="quiz" hidden>
        <div class="quiz-card">
          <p id="quiz-timer"></p>
          <div class="quiz-bar"><div id="quiz-bar-fill"></div></div>
          <h2 id="quiz-question"></h2>
          <div id="quiz-choices"></div>
        </div>
      </div>

      <button id="btn-exit">BACK</button>
      <div id="rotate-hint"><p>Rotate your phone sideways to play</p></div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
  <script src="game.js"></script>
</body>
</html>
