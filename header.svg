<svg fill="none" viewBox="0 0 800 280" width="800" height="280" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .banner {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #111827 0%, #030712 100%);
          border: 2px solid #27272a;
          border-radius: 16px;
          padding: 32px;
          height: 212px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
          position: relative;
          overflow: hidden;
        }

        .banner::before {
          content: '';
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: radial-gradient(circle, rgba(234, 179, 8, 0.05) 0%, transparent 60%);
          animation: float 6s ease-in-out infinite;
        }

        .title {
          font-size: 32px;
          font-weight: 900;
          letter-spacing: 2px;
          margin: 0 0 12px 0;
          background: linear-gradient(to right, #ffffff 20%, #eab308 50%, #ef4444 80%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .description {
          font-size: 16px;
          color: #9ca3af;
          max-width: 600px;
          margin: 0 0 24px 0;
          line-height: 1.5;
        }

        .badge-container {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          justify-content: center;
        }

        .badge {
          display: flex;
          align-items: center;
          padding: 6px 14px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 600;
          border: 1px solid transparent;
        }

        .badge-live {
          background-color: rgba(34, 197, 94, 0.1);
          color: #4ade80;
          border-color: rgba(34, 197, 94, 0.3);
        }

        .badge-github {
          background-color: rgba(255, 255, 255, 0.05);
          color: #f3f4f6;
          border-color: rgba(255, 255, 255, 0.1);
        }

        .badge-js {
          background-color: rgba(234, 179, 8, 0.1);
          color: #fde047;
          border-color: rgba(234, 179, 8, 0.3);
        }

        .status-dot {
          width: 8px;
          height: 8px;
          background-color: #22c55e;
          border-radius: 50%;
          display: inline-block;
          margin-right: 8px;
          animation: blink 1.5s infinite;
        }

        @keyframes blink {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }

        @keyframes float {
          0%, 100% { transform: translate(0, 0); }
          50% { transform: translate(5%, 5%); }
        }
      </style>

      <div class="banner">
        <h1 class="title">BELGIUM GEO PROJECT</h1>
        <p class="description">
          An interactive country fair project featuring a PowerPoint-style showcase and a quiz-based side-scroller.
        </p>
        
        <div class="badge-container">
          <div class="badge badge-live">
            <span class="status-dot"></span>Live Demo
          </div>
          <div class="badge badge-github">
            Play on GitHub
          </div>
          <div class="badge badge-js">
            Vanilla JS Project
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
