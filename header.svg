<svg fill="none" viewBox="0 0 800 220" width="800" height="220" xmlns="http://w3.org">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      fill: #9ca3af;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .glow {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Circle Pattern -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Country Fair Gradient (Belgium: White/Yellow/Red) -->
    <linearGradient id="belgium-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="220" rx="16" fill="url(#bg-grad)" stroke="#27272a" stroke-width="2"/>
  
  <!-- Decorative Glow -->
  <circle class="glow" cx="400" cy="110" r="300" fill="url(#glow-grad)"/>

  <!-- Centered Header Text Group -->
  <g text-anchor="middle">
    <text x="400" y="75" class="title" fill="url(#belgium-grad)">BELGIUM GEO PROJECT</text>
    <text x="400" y="115" class="subtitle">An interactive country fair project featuring a presentation showcase and a quiz side-scroller.</text>
  </g>

  <!-- Centered Badges Row -->
  <g transform="translate(190, 150)">
    <!-- Live Demo Badge -->
    <g transform="translate(0, 0)">
      <rect width="120" height="32" rx="8" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.3"/>
      <circle cx="20" cy="16" r="4" fill="#22c55e" class="glow"/>
      <text x="70" y="21" class="badge-text" fill="#4ade80" text-anchor="middle">Live Demo</text>
    </g>

    <!-- Play on GitHub Badge -->
    <g transform="translate(135, 0)">
      <rect width="130" height="32" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="21" class="badge-text" fill="#f3f4f6" text-anchor="middle">Play on GitHub</text>
    </g>

    <!-- Vanilla JS Badge -->
    <g transform="translate(280, 0)">
      <rect width="140" height="32" rx="8" fill="#eab308" fill-opacity="0.1" stroke="#eab308" stroke-opacity="0.3"/>
      <text x="70" y="21" class="badge-text" fill="#fde047" text-anchor="middle">Vanilla JS Project</text>
    </g>
  </g>
</svg>
